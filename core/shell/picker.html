 if(s.levels.length){sd.appendChild(E('div','hd gap','SECURITY FOLDERS'));s.levels.forEach(function(p){var r=E('div','pl',FOLDER(LVC[p.level]));var t=E('span');t.textContent=p.name;r.appendChild(t);r.dataset.path=p.path;r.onclick=function(){go(p.path);};sd.appendChild(r);});}
 var ft=document.getElementById('ft');
 if(s.mode==='save'){var lb=E('label');lb.textContent='Save as';ft.appendChild(lb);var nm=E('input','inset');nm.id='nm';nm.value=s.name||'';nm.oninput=updateBtn;ft.appendChild(nm);}
 else{var sp=E('div');sp.id='fill';if(s.mode==='folder'){sp.style.fontSize='12px';sp.style.color='#8E8E93';sp.textContent='Choose a folder, or open one and press Choose.';}ft.appendChild(sp);}
 if(s.filters.length){var w=E('div','sel2');var sl=E('select');sl.id='flt';s.filters.forEach(function(f,i){var o=E('option');o.value=i;o.textContent=f.name;sl.appendChild(o);});sl.onchange=function(){render();};w.appendChild(sl);ft.appendChild(w);}
 var cb=E('button','b');cb.textContent='Cancel';cb.onclick=cancel;ft.appendChild(cb);
 var ok=E('button','b pri');ok.id='ok';ok.textContent=s.mode==='save'?(s.okLabel||'Save'):s.mode==='folder'?(s.okLabel||'Choose'):(s.okLabel||'Open');ok.onclick=submit;ft.appendChild(ok);
 return go(s.dir,false).then(function(){if(s.mode==='save'){var n=document.getElementById('nm');n.focus();var dot=n.value.lastIndexOf('.');n.setSelectionRange(0,dot>0?dot:n.value.length);}else document.getElementById('list').focus();});
});
