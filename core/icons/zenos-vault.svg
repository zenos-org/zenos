<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- ZENOS Vault: machined aluminium vault door. Placeholder until the Figma icon is exported. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf2"/><stop offset="0.5" stop-color="#b9c1cb"/><stop offset="1" stop-color="#7d8794"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5d6672"/>
