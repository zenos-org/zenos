  <g fill="#3fd18a"><circle cx="64" cy="22" r="3.2"/><circle cx="104" cy="51" r="3.2"/><circle cx="89" cy="98" r="3.2"/><circle cx="39" cy="98" r="3.2"/><circle cx="24" cy="51" r="3.2"/></g>
