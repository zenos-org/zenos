<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ZENOS Office: the fonts Word, Excel and PowerPoint files ask for, mapped to free fonts with the same widths where
     one exists, so lines and pages break where they did. IPA fonts (fonts-ipafont) are drawn to the metrics of the
     MS fonts; Carlito and Caladea (fonts-crosextra-*) to Calibri and Cambria; Liberation to Arial, Times New Roman and
     Courier New. -->
<fontconfig>
  <alias binding="same"><family>ＭＳ 明朝</family><accept><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐ明朝</family><accept><family>IPAPMincho</family></accept></alias>
  <alias binding="same"><family>MS PMincho</family><accept><family>IPAPMincho</family></accept></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><accept><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><accept><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>MS PGothic</family><accept><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>MS UI Gothic</family><accept><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>游明朝</family><accept><family>IPAexMincho</family><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>Yu Mincho</family><accept><family>IPAexMincho</family><family>IPAMincho</family></accept></alias>
  <alias binding="same"><family>游ゴシック</family><accept><family>IPAexGothic</family><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>IPAexGothic</family><family>IPAGothic</family></accept></alias>
  <alias binding="same"><family>メイリオ</family><accept><family>IPAexGothic</family><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>IPAexGothic</family><family>IPAPGothic</family></accept></alias>
  <alias binding="same"><family>HG丸ｺﾞｼｯｸM-PRO</family><accept><family>IPAexGothic</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Century</family><accept><family>IPAMincho</family></accept></alias>
</fontconfig>
