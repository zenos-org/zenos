# ZENOS: fewer ways into the kernel (installed as /usr/lib/sysctl.d/60-zenos-hardening.conf).
# An administrator can override a line in /etc/sysctl.d/ with a later file; docs/THREAT_MODEL.md explains each.

# Multipath TCP: no ZENOS program uses it, and its code has had remote, pre-authentication holes
# (CVE-2026-98432, fixed in Debian's 6.12.113-1). Off by default.
net.mptcp.enabled = 0

# io_uring: a large, often-patched kernel interface no ZENOS program needs. 2 = refused for everyone.
kernel.io_uring_disabled = 2

# BPF: only root may load programs (the network sentinel is root), and JIT output is hardened.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Kernel addresses and the kernel log are not shown to ordinary users (they help an attacker aim).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3

# No loading of a new kernel at run time, no automatic loading of old TTY line disciplines.
kernel.kexec_load_disabled = 1
dev.tty.ldisc_autoload = 0

# A program may only debug (ptrace) its own children.
kernel.yama.ptrace_scope = 1

# Links, FIFOs and files in shared sticky directories cannot be used to trick root programs.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# Network: no redirects or source routes accepted, reverse-path filtering on (loose, so a VPN keeps working).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_syncookies = 1
