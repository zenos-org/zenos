# ZENOS (installed as /etc/default/grub.d/zenos-hardening.cfg): the kernel starts in lockdown "integrity" mode.
# Even root cannot then load an unsigned kernel module, write to kernel memory (/dev/mem, /dev/kmem), replace the
# running kernel (kexec) or hibernate to an image it could alter. The network sentinel's eBPF sensor works in this
# mode (tested on 0.1.1 + these settings). A PC that needs an unsigned driver (DKMS) removes this file and runs update-grub.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lockdown=integrity"
