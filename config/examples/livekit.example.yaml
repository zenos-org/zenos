# LiveKit server configuration for ZENOS calls (self-hosted). Copy to the install location and fill in.
# Keys are generated per installation: livekit-server generate-keys
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_API_SECRET
