# ZENOS installer: full-disk encryption is the default. The "Encrypt system" box starts checked; the passphrase
# is asked at every boot. The key agent's keys, the swap file and the ledgers then rest encrypted on the disk.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
userSwapChoices:
  - none
  - file
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
# GRUB in Debian 13 unlocks LUKS1 reliably (LUKS2 with Argon2 it cannot)
luksGeneration: luks1
