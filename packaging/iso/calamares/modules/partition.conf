# ZENOS installer: full-disk encryption is the default. The "Encrypt system" box starts checked; the passphrase
# is asked at every boot. The key agent's keys, the swap file and the ledgers then rest encrypted on the disk.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
userSwapChoices:
  - none
  - file
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
# A small unencrypted /boot holds only the kernel and the boot screen; everything else is encrypted. The passphrase
# is then asked once, on the ZENOS boot screen (GRUB no longer unlocks the disk in a text prompt), and the root can
# use LUKS2 with Argon2. Trade-off: /boot can be altered by someone with the disk in hand; Secure Boot checks it.
luksGeneration: luks2
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    noEncrypt: true
    mountPoint: "/boot"
    size: 1G
  - name: "root"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
