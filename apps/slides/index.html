<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZENOS Slides</title>
  </head>
  <body>
    <div id="bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="zg" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6E5BFF"/><stop offset="0.4" stop-color="#9B3BEF"/>
              <stop offset="0.72" stop-color="#D83AB0"/><stop offset="1" stop-color="#FF6A8B"/>
            </linearGradient>
          </defs>
          <path d="M24 5.5c10.2 0 18.5 8.3 18.5 18.5S34.2 42.5 24 42.5 5.5 34.2 5.5 24 13.8 5.5 24 5.5Z"
                stroke="url(#zg)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="104 24"/>
          <path d="M16 17h16l-15 14h16" stroke="url(#zg)" stroke-width="3.4" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>ZENOS Slides</span>
      </div>
      <button id="btn-open" type="button">開く</button>
      <button id="btn-save" type="button">保存</button>
      <div class="spacer"></div>
      <button id="btn-ai" type="button">AI</button>
      <button id="btn-settings" type="button" title="AI 接続設定">設定</button>
      <input id="fileinput" type="file" accept=".pptx" style="display:none" />
    </div>
    <div id="toolbar">
      <button id="t-addtext" type="button">＋テキスト</button>
      <button id="t-addrect" type="button" title="矩形">＋矩形</button>
      <button id="t-addellipse" type="button" title="楕円">＋楕円</button>
      <button id="t-addline" type="button" title="線">＋線</button>
      <button id="t-addimg" type="button" title="画像を挿入">＋画像</button>
      <input id="t-fill" type="color" value="#4472c4" title="図形の塗り／線色" />
      <div class="sep"></div>
      <button id="t-bold" type="button" style="font-weight:700">B</button>
      <button id="t-italic" type="button" style="font-style:italic">I</button>
      <select id="t-size" title="文字サイズ">
        <option>16</option><option>20</option><option>24</option><option selected>32</option>
        <option>40</option><option>48</option><option>60</option><option>72</option><option>96</option>
      </select>
      <input id="t-color" type="color" value="#111111" title="文字色" />
      <button id="t-left" type="button" title="左揃え">⯇</button>
      <button id="t-center" type="button" title="中央揃え">≡</button>
      <button id="t-right" type="button" title="右揃え">⯈</button>
      <button id="t-bullet" type="button" title="箇条書き（編集中は Tab で階層）">• 箇条書き</button>
      <div class="sep"></div>
      <span class="tlabel">背景</span>
      <input id="t-bg" type="color" value="#ffffff" title="スライド背景色" />
      <span class="tlabel">アニメ</span>
      <select id="t-anim" title="選択要素のアニメーション">
        <option value="none">なし</option>
        <option value="fade">フェード</option>
      </select>
      <div class="sep"></div>
      <button id="t-delbox" type="button">削除</button>
      <div class="spacer" style="flex:1"></div>
      <button id="t-addslide" type="button">＋スライド</button>
      <button id="t-delslide" type="button">スライド削除</button>
    </div>
    <div id="main">
      <div id="rail"></div>
      <div id="stage"><div id="slidewrap"><div id="slide"></div></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
