<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZENOS Slides</title>
  </head>
  <body>
    <div id="bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="zg" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6E5BFF"/><stop offset="0.4" stop-color="#9B3BEF"/>
              <stop offset="0.72" stop-color="#D83AB0"/><stop offset="1" stop-color="#FF6A8B"/>
            </linearGradient>
          </defs>
          <path d="M24 5.5c10.2 0 18.5 8.3 18.5 18.5S34.2 42.5 24 42.5 5.5 34.2 5.5 24 13.8 5.5 24 5.5Z"
                stroke="url(#zg)" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-dasharray="104 24"/>
          <path d="M16 17h16l-15 14h16" stroke="url(#zg)" stroke-width="3.4" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>ZENOS Slides</span>
      </div>
      <button id="btn-open" type="button">Open</button>
      <button id="btn-save" type="button">Save</button>
      <div class="spacer"></div>
      <button id="btn-ai" type="button">AI</button>
      <button id="btn-settings" type="button" title="AI connection settings">Settings</button>
      <input id="fileinput" type="file" accept=".pptx" style="display:none" />
    </div>
    <div id="toolbar">
      <button id="t-addtext" type="button">+ Text</button>
      <button id="t-addrect" type="button" title="Rectangle">+ Rectangle</button>
      <button id="t-addellipse" type="button" title="Ellipse">+ Ellipse</button>
      <button id="t-addline" type="button" title="Line">+ Line</button>
      <button id="t-addimg" type="button" title="Insert image">+ Image</button>
      <input id="t-fill" type="color" value="#4472c4" title="Shape fill / line color" />
      <div class="sep"></div>
      <button id="t-bold" type="button" style="font-weight:700">B</button>
      <button id="t-italic" type="button" style="font-style:italic">I</button>
      <select id="t-size" title="Text size">
        <option>16</option><option>20</option><option>24</option><option selected>32</option>
        <option>40</option><option>48</option><option>60</option><option>72</option><option>96</option>
      </select>
      <input id="t-color" type="color" value="#111111" title="Text color" />
      <button id="t-left" type="button" title="Align left">⯇</button>
      <button id="t-center" type="button" title="Center">≡</button>
      <button id="t-right" type="button" title="Align right">⯈</button>
      <button id="t-bullet" type="button" title="Bullets (Tab to indent while editing)">• Bullets</button>
      <div class="sep"></div>
      <span class="tlabel">Background</span>
      <input id="t-bg" type="color" value="#ffffff" title="Slide background color" />
      <span class="tlabel">Animation</span>
      <select id="t-anim" title="Animation of the selected item">
        <option value="none">None</option>
        <option value="fade">Fade</option>
      </select>
      <div class="sep"></div>
      <button id="t-delbox" type="button">Delete</button>
      <div class="spacer" style="flex:1"></div>
      <button id="t-addslide" type="button">+ Slide</button>
      <button id="t-delslide" type="button">Delete slide</button>
    </div>
    <div id="main">
      <div id="rail"></div>
      <div id="stage"><div id="slidewrap"><div id="slide"></div></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
